substitutions:
  # Default name
  name: "sonoff-thr316-esphome"
  # Default friendly name
  friendly_name: "Sonoff THR316 ESPHome"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Sonoff THR316 ESPHome with Sonoff WTS01 Temperature Sensor and thermostat control"
  # Project Name
  project_name: "SmartPad.Sonoff THR316 ESPHome"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v1.0.0"
  # Restore the relay (GPIO switch) upon reboot to state. The relay is also forced off at boot (see on_boot) as it normally drives a heater/pump.
  relay_restore_mode: "RESTORE_DEFAULT_OFF"
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as smartpad-em32-smart-plug.local in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the device. Useful if the device is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Africa/Johannesburg")
  timezone: "Africa/Johannesburg"
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "WARN"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  # Specify Web Server Versions
  web_server_version: "2"
  # Default thermostat heating target temperature
  default_target_temperature: "20 °C"
  # How far (in °C) the temperature must fall below the target before the relay switches on
  heat_deadband: "2"
  # Calibration offset (in °C) applied to the WTS01 reading. Use a negative value to reduce the reading.
  temperature_offset: "0.0"
########################## End of Substitutions #########################

# Board Configuration
esp32:
  variant: esp32
  framework:
    type: esp-idf

# Core Configuration
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  min_version: 2025.7.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: 90
      then:
        # Make sure the relay is in a known state at startup
        - switch.turn_off: relay
        # Default to running the climate control in Home preset
        - climate.control:
            id: climate_control
            preset: "Home"

dashboard_import:
  package_import_url: github://Smartpadza/Device_Configs/sonoff-thr316-esphome.yaml
  import_full_config: false # or true

preferences:
  flash_write_interval: 5min

# Specify Logging level
logger:
  level: ${log_level}
  baud_rate: 0

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# Enable Web Server
web_server:
  port: 80
  version: ${web_server_version}

network:
  enable_ipv6: ${ipv6_enable}

# Wifi Configuration
wifi:
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

# Enable Captive Portal Fallback
captive_portal:

# UART for the Sonoff WTS01 sensor (RJ9 jack, data on GPIO25, RX only)
uart:
  id: sensor_uart
  rx_pin: GPIO25
  baud_rate: 9600

# Outputs for the front panel LEDs
output:
  - platform: gpio
    id: switch_led_output
    pin:
      number: GPIO16  # Left LED (Red) - relay state
      inverted: true
  - platform: gpio
    id: auto_led_output
    pin:
      number: GPIO13  # Right LED (Green) - climate control active
      inverted: true

# Device LED Configuration
light:
  - platform: status_led
    id: status
    pin:
      number: GPIO15  # Middle LED (Blue) - WiFi status
      inverted: true  # HIGH = off, LOW = on
      ignore_strapping_warning: true
  - platform: binary
    id: switch_led
    output: switch_led_output
    internal: true
  - platform: binary
    id: auto_led
    output: auto_led_output
    internal: true

# Keep the blue LED lit while WiFi is connected
interval:
  - interval: 30s
    then:
      if:
        condition:
          wifi.connected:
        then:
          - light.turn_on: status
        else:
          - light.turn_off: status

# Relay
switch:
  - platform: gpio
    pin: GPIO21
    id: relay
    name: "Relay"
    restore_mode: ${relay_restore_mode}
    on_turn_on:
      - delay: 500ms
      - light.turn_on: switch_led
    on_turn_off:
      - delay: 500ms
      - light.turn_off: switch_led

  # Powers the external sensor. It receives 3v3 from this pin, which must be high.
  - platform: gpio
    pin: GPIO27
    id: sensor_power
    internal: true
    restore_mode: ALWAYS_ON

# Physical Button
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true  # HIGH = off, LOW = on
      ignore_strapping_warning: true
    id: device_button
    internal: true
    name: "Button"
    filters:
      - delayed_on: 50ms
    on_multi_click:
      # Short press: toggle the relay manually and turn off climate control
      - timing:
          - ON for at most 0.35s
          - OFF for at least 0.2s
        then:
          - switch.toggle: relay
          - climate.control:
              id: climate_control
              mode: "OFF"
      # Long press (0.36s - 3s): toggle climate control
      - timing:
          - ON for 0.36s to 3s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                lambda: 'return id(climate_control).mode == CLIMATE_MODE_OFF;'
              then:
                # Turn the relay off first. If the relay is on when climate control is
                # enabled in idle mode, the thermostat will not switch it off automatically.
                - switch.turn_off: relay
                - climate.control:
                    id: climate_control
                    mode: "HEAT"
              else:
                - climate.control:
                    id: climate_control
                    mode: "OFF"
      # Very long press: factory reset
      - timing:
          - ON for at least 10s
        then:
          - button.press: device_Reset

# Buttons for Reset, Restart, Safe Mode
button:
  - platform: factory_reset
    id: device_Reset
    name: "Reset to Factory Default Settings"
    entity_category: diagnostic
  - platform: restart
    name: "Restart"
    id: device_restart
    entity_category: diagnostic
  - platform: safe_mode
    name: "Safe Mode"
    id: device_safe_mode
    entity_category: config

# Time Configuration
time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"
    update_interval: ${sntp_update_interval}
    servers:
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'

# Temperature and Diagnostic Sensors
sensor:
  # Sonoff WTS01 temperature sensor
  - platform: wts01
    name: "Temperature"
    id: temp
    uart_id: sensor_uart
    filters:
      - offset: ${temperature_offset}

  - platform: internal_temperature
    name: "ESP32 Internal Temp"
    id: esp32_temp
    entity_category: diagnostic
    disabled_by_default: true

  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    update_interval: 1h
    entity_category: diagnostic
    internal: true
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 1h
    entity_category: "diagnostic"
    disabled_by_default: true
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: 'return (x > -50) ? 100 : (x < -100) ? 0 : 2 * (x + 100);'
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      entity_category: diagnostic
  - platform: template
    name: "Last Restart"
    id: device_last_restart
    entity_category: diagnostic
  - platform: template
    name: "Uptime"
    id: device_uptime
    entity_category: diagnostic
    lambda: |-
      int seconds = static_cast<int>(id(uptime_sensor).state);
      int days = seconds / 86400;
      seconds %= 86400;
      int hours = seconds / 3600;
      seconds %= 3600;
      int minutes = seconds / 60;
      seconds %= 60;
      if (days > 3650) return {"Starting up"};
      else if (days > 0) return {str_sprintf("%dd %dh %dm %ds", days, hours, minutes, seconds)};
      else if (hours > 0) return {str_sprintf("%dh %dm %ds", hours, minutes, seconds)};
      else if (minutes > 0) return {str_sprintf("%dm %ds", minutes, seconds)};
      else return {str_sprintf("%ds", seconds)};
    icon: mdi:clock-start

# Thermostat Control
climate:
  - platform: thermostat
    id: climate_control
    name: "Climate Control"
    sensor: temp
    min_heating_off_time: 5s
    min_heating_run_time: 5s
    min_idle_time: 5s
    heat_deadband: ${heat_deadband}
    heat_action:
      - switch.turn_on: relay
    idle_action:
      - switch.turn_off: relay
    off_mode:
      - switch.turn_off: relay
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: ${default_target_temperature}
    on_state:
      - if:
          condition:
            lambda: 'return id(climate_control).mode == CLIMATE_MODE_OFF;'
          then:
            - light.turn_off: auto_led
      - if:
          condition:
            lambda: 'return id(climate_control).mode == CLIMATE_MODE_HEAT;'
          then:
            - light.turn_on: auto_led
