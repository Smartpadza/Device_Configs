substitutions:
  # Default name
  name: "sonoff-mini-r4-esphome"
  # Default friendly name
  friendly_name: "Sonoff Mini R4 Extreme ESPHome"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Sonoff Mini R4 Extreme ESPHome"
  # Project Name
  project_name: "SmartPad.Sonoff Mini R4 Extreme ESPHome"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v1.0.0"
  # Restore the relay (GPIO switch) upon reboot to state:
  relay_restore_mode: "RESTORE_DEFAULT_ON"
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as smartpad-em32-smart-plug.local in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the device. Useful if the device is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Africa/Johannesburg")
  timezone: "Africa/Johannesburg"
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "WARN"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  # Specify Web Server Versions
  web_server_version: "2"
########################## End of Substitutions #########################

# Board Configuration
esp32:
  variant: esp32
  framework:
    type: arduino

# Core Configuration
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  min_version: 2024.6.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  # Power Restore Mode for the Relay
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode_relay
            index: !lambda 'return id(restore_mode_relay);'
        - lambda: |-
            // Relay
            switch(id(restore_mode_relay)) {
              case 0: id(relay).turn_off(); break;  // Always Off
              case 1: id(relay).turn_on(); break;   // Always On
              case 2: break;                         // Restore Previous State (handled by switch.restore_mode)
              default: id(relay).turn_off(); break; // Fallback
            }

# Power On State Selector for the Relay
select:
  - platform: template
    name: "Relay Power On State"
    id: power_mode_relay
    optimistic: true
    icon: mdi:electric-switch
    initial_option: "Restore Previous State"
    options:
      - "Always Off"
      - "Always On"
      - "Restore Previous State"
    on_value:
      then:
        - lambda: 'id(restore_mode_relay) = i;'

dashboard_import:
  package_import_url: github://Smartpadza/Device_Configs/sonoff-mini-r4-extreme-esphome.yaml
  import_full_config: false # or true

globals:
  - id: restore_mode_relay
    type: int
    restore_value: yes
    initial_value: "2"  # 0 = Always Off, 1 = Always On, 2 = Restore Previous State

preferences:
  flash_write_interval: 5min

# Specify Logging level
logger:
  level: ${log_level}
  baud_rate: 0

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# Enable Web Server
web_server:
  port: 80
  version: ${web_server_version}

network:
  enable_ipv6: ${ipv6_enable}

# Wifi Configuration
wifi:
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

# Enable Captive Portal Fallback
captive_portal:

# Device LED Configuration
light:
  - platform: status_led
    id: status
    pin:
      number: GPIO19  # Status LED
      inverted: true  # HIGH = off, LOW = on

# Relay
switch:
  - platform: gpio
    pin: GPIO26
    id: relay
    name: "Relay"
    restore_mode: ${relay_restore_mode}

# Physical Button and External Switch Input
binary_sensor:
  # On-board push button
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true  # HIGH = off, LOW = on
    id: device_button
    internal: true
    name: "Button"
    filters:
      - delayed_on: 50ms
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: relay
      - timing:
          - ON for at least 10s  # Long press for factory reset
        then:
          - button.press: device_Reset

  # External switch input S1 - any change of switch position toggles the relay
  - platform: gpio
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    id: switch_input_1
    name: "Switch Input"
    entity_category: diagnostic
    filters:
      - delayed_on_off: 50ms
    on_state:
      then:
        - switch.toggle: relay

# Buttons for Reset, Restart, Safe Mode
button:
  - platform: factory_reset
    id: device_Reset
    name: "Reset to Factory Default Settings"
    entity_category: diagnostic
  - platform: restart
    name: "Restart"
    id: device_restart
    entity_category: diagnostic
  - platform: safe_mode
    name: "Safe Mode"
    id: device_safe_mode
    entity_category: config

# Time Configuration
time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"
    update_interval: ${sntp_update_interval}
    servers:
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'

# Diagnostic Sensors
sensor:
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    update_interval: 1h
    entity_category: diagnostic
    internal: true
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 1h
    entity_category: "diagnostic"
    disabled_by_default: true
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: 'return (x > -50) ? 100 : (x < -100) ? 0 : 2 * (x + 100);'
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      entity_category: diagnostic
    dns_address:
      name: "DNS Address"
      entity_category: diagnostic
  - platform: template
    name: "Last Restart"
    id: device_last_restart
    entity_category: diagnostic
  - platform: template
    name: "Uptime"
    id: device_uptime
    entity_category: diagnostic
    lambda: |-
      int seconds = static_cast<int>(id(uptime_sensor).state);
      int days = seconds / 86400;
      seconds %= 86400;
      int hours = seconds / 3600;
      seconds %= 3600;
      int minutes = seconds / 60;
      seconds %= 60;
      if (days > 3650) return {"Starting up"};
      else if (days > 0) return {str_sprintf("%dd %dh %dm %ds", days, hours, minutes, seconds)};
      else if (hours > 0) return {str_sprintf("%dh %dm %ds", hours, minutes, seconds)};
      else if (minutes > 0) return {str_sprintf("%dm %ds", minutes, seconds)};
      else return {str_sprintf("%ds", seconds)};
    icon: mdi:clock-start
